6.2,-.3],['Work&life balance',5.8,-.7],['Мотивация',7,.1]];const el=id=>document.getElementById(id);const metric=(l,v,m,c='')=>`<div class="card pad metric"><div class="label">${l}</div><div class="value">${v}</div><div class="meta ${c}">${m}</div></div>`;const topicTable=()=>`<div class="table-wrap"><table><thead><tr><th>Тема</th><th>Среднее</th><th>Изменение</th></tr></thead><tbody>${topics.map(t=>`<tr><td>${t[0]}</td><td>${t[1].toFixed(1)}</td><td class="${t[2]<0?'down':t[2]>0?'up':''}">${t[2]>0?'+':''}${t[2].toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`;function leaderOverview(){return`<div class="note blue">Лидер получает полную аналитику своего круга. JTBD меняет приоритет: сначала что изменилось и где нужен фокус, затем детализация.</div><div class="grid grid-4 section">${metric('Factor Team','7.2','+0.3','up')}${metric('Участие','74%','31 из 42')}${metric('Тем улучшились','4','за период','up')}${metric('Тем требуют внимания','3','по сигналам','down')}</div><div class="section"><div class="section-head"><div><h2>Что изменилось</h2><p>Сводка перед синком</p></div></div><div class="change-grid"><div class="change-card"><div class="kicker">Сильный сдвиг</div><strong>Работа в команде</strong><div class="change-value up">+0.5</div></div><div class="change-card"><div class="kicker">Устойчивый риск</div><strong>Work&life balance</strong><div class="change-value down">−0.7</div></div><div class="change-card"><div class="kicker">Локальный сигнал</div><strong>Развитие</strong><div class="change-value down">−0.3</div></div></div></div><div class="grid grid-2 section"><div class="card pad"><div class="section-head"><div><h2>Зоны внимания</h2><p>Сигнал → причина</p></div></div><div class="zone-list"><div class="zone"><div><strong>Work&life balance</strong><small>Снижается 2 периода · нагрузка и вмешательство работы в личное время</small></div><div class="zone-score down">5.8</div></div><div class="zone"><div><strong>Развитие</strong><small>Ниже медианы компании</small></div><div class="zone-score down">6.2</div></div></div></div><div class="card pad"><div class="section-head"><div><h2>Следующие действия</h2></div></div><div class="action-card"><div class="action-label">Сигнал</div><strong>Work&life balance снижается</strong><div class="action-label">Что проверить</div><p>Какие роли и типы задач создают перегрузку.</p><div class="action-label">Следующий шаг</div><p>Разобрать нагрузку на синке и зафиксировать одно изменение.</p></div></div></div><div class="section"><div class="section-head"><div><h2>Темы</h2></div></div>${topicTable()}</div>`}function leaderAnalytics(){return`<div class="section-head"><div><h2>Полная аналитика своего круга</h2><p>Темы → вопросы → динамика → AI-интерпретация</p></div></div><div class="filters"><select><option>Product</option></select><select><option>Август 2026</option></select><select><option>Все темы</option></select></div><div class="ai-hero section"><div class="ai-head"><span class="ai-badge">AI-сводка</span><span class="ai-confidence">Демо · уверенность 78%</span></div><p class="ai-summary"><strong>Главный сигнал:</strong> общий результат стабилен, но внутри него расходятся тенденции. Работа в команде улучшается, а Work&life balance снижается второй период подряд. Это больше похоже на локальную проблему нагрузки, чем на общее ухудшение состояния команды.</p><div class="ai-grid section"><div class="ai-card"><div class="eyebrow">Что улучшилось</div><h3>Командное взаимодействие</h3><p>Рост +0.5. Одновременно вовлеченность растёт на +0.4.</p><div class="ai-evidence">Основание: 31 ответ · 2 связанные темы растут</div></div><div class="ai-card"><div class="eyebrow">Что ухудшилось</div><h3>Баланс работы и личного времени</h3><p>Тема снизилась до 5.8. Главный вклад даёт вопрос о вмешательстве задач в личное время.</p><div class="ai-evidence">−0.7 · второй период снижения</div></div><div class="ai-card"><div class="eyebrow">Гипотеза</div><h3>Перегрузка, а не демотивация</h3><p>Вовлеченность и командная работа не падают, поэтому гипотеза «нагрузка/приоритеты» выглядит вероятнее.</p><div class="ai-evidence">Гипотеза требует проверки с командой</div></div></div></div><div class="table-wrap section"><table><thead><tr><th>Тема</th><th>Вопрос</th><th>Среднее</th><th>Медиана</th><th>Ответов</th><th>AI-сигнал</th></tr></thead><tbody><tr><td>Отношение с лидером</td><td>Мой лидер прозрачно и четко формулирует цели и задачи</td><td>7.4</td><td>7.5</td><td>31</td><td><span class="status gray">Стабильно</span></td></tr><tr><td>Фидбэк</td><td>Лидер создаёт пространство для качественной обратной связи</td><td>6.7</td><td>7.0</td><td>31</td><td><span class="status yellow">Ниже медианы</span></td></tr><tr><td>Развитие</td><td>Лидер помогает находить возможности для роста</td><td>6.2</td><td>6.8</td><td>30</td><td><span class="status yellow">Снижение</span></td></tr><tr><td>Work&life balance</td><td>Лидер помогает минимизировать вмешательство задач в личное время</td><td>5.8</td><td>6.5</td><td>31</td><td><span class="status yellow">Устойчивый риск</span></td></tr></tbody></table></div>`}function dynamics(){return`<div class="section-head"><div><h2>Динамика</h2><p>Автоматический поиск переломных точек</p></div></div><div class="grid grid-3">${metric('Март','6.3','Factor Team')}${metric('Июнь','6.9','Factor Team')}${metric('Август','7.2','Factor Team','up')}</div><div class="grid grid-2 section"><div class="card pad"><strong>Factor Team · 6 периодов</strong><div class="spark"><span style="height:36%"></span><span style="height:45%"></span><span style="height:50%"></span><span style="height:62%"></span><span style="height:70%"></span><span style="height:78%"></span></div><p style="font-size:11px;color:var(--muted)">Устойчивый рост после апреля.</p></div><div class="ai-hero"><div class="ai-head"><span class="ai-badge">AI-интерпретация</span></div><p class="ai-summary">Рост общего лидерского показателя не означает улучшение всех тем. В августе Factor Team растёт, но Work&life balance и развитие снижаются.</p></div></div><div class="ai-grid section"><div class="signal-card"><h3>Переломная точка · июнь</h3><p>После июня ускорился рост командного взаимодействия.</p></div><div class="signal-card"><h3>Отрицательный тренд · июль–август</h3><p>Work&life balance снижается два периода подряд.</p></div></div>`}function attention(){return`<div class="section-head"><div><h2>Зоны внимания</h2><p>AI ранжирует сигналы по силе и устойчивости</p></div></div><div class="rec-list"><div class="rec"><span class="rec-num">1</span><div><h3>Work&life balance · высокий приоритет</h3><p>5.8, снижение −0.7 и второй период отрицательной динамики. Главный драйвер — вмешательство рабочих задач в личное время.</p></div><div class="rec-meta">Сила сигнала<br><strong>Высокая</strong></div></div><div class="rec"><span class="rec-num">2</span><div><h3>Развитие · средний приоритет</h3><p>6.2, ниже медианы компании на 0.6. Сигнал слабее и менее устойчив, чем по балансу.</p></div><div class="rec-meta">Сила сигнала<br><strong>Средняя</strong></div></div><div class="rec"><span class="rec-num">3</span><div><h3>Фидбэк · наблюдать</h3><p>6.7, показатель стабилен, но остаётся ниже желаемого уровня.</p></div><div class="rec-meta">Сила сигнала<br><strong>Низкая</strong></div></div></div><div class="note yellow section">AI не ставит диагноз. Он ранжирует сигналы и формирует проверяемые гипотезы.</div>`}function recommendations(){return`<div class="section-head"><div><h2>Рекомендации</h2><p>От сигнала к проверяемому следующему действию</p></div></div><div class="ai-hero"><div class="ai-head"><span class="ai-badge">AI-рекомендации</span><span class="ai-confidence">Демо · август</span></div><p class="ai-summary">Рекомендации сформулированы как действия и эксперименты, а не готовый диагноз.</p></div><div class="rec-list section"><div class="rec"><span class="rec-num">1</span><div><h3>Проверить источники перегрузки</h3><p>На ближайшем синке собрать 3–5 повторяющихся ситуаций, когда работа выходит в личное время, и разделить их на срочность, неясные приоритеты и нехватку ресурсов.</p></div><div class="rec-meta">Эффект<br><strong>1–2 периода</strong></div></div><div class="rec"><span class="rec-num">2</span><div><h3>Сделать одно изменение в приоритетах</h3><p>Убрать, перенести или явно понизить приоритет минимум одной повторяющейся задачи и проверить изменение в следующей волне.</p></div><div class="rec-meta">Тип<br><strong>Эксперимент</strong></div></div><div class="rec"><span class="rec-num">3</span><div><h3>Уточнить запрос на развитие</h3><p>На one-to-one спросить, какую новую задачу или ответственность сотрудник хотел бы попробовать в следующие 2 месяца.</p></div><div class="rec-meta">Тип<br><strong>Диагностика</strong></div></div></div><div class="grid grid-2 section"><div class="card pad"><strong>Что AI не рекомендует</strong><p style="font-size:11px;color:var(--muted)">Не запускать общий «мотивационный» формат: мотивация и вовлеченность не являются главными зонами снижения.</p></div><div class="card pad"><strong>Как проверить эффект</strong><p style="font-size:11px;color:var(--muted)">Сравнить следующий период по тем же вопросам и связать изменение с конкретным действием.</p></div></div>`}function hr(){return`<div class="grid grid-4">${metric('Участие','71%','по кругам')}${metric('Среднее','7.1','по темам')}${metric('Медиана','7.3','по темам')}${metric('Factor Team','7.0','по лидерским вопросам')}</div><div class="section"><div class="section-head"><div><h2>Сигналы по компании</h2></div></div><div class="grid grid-3"><div class="insight-card"><div class="signal">Системный сигнал</div><h3>Work&life balance</h3><p>Снижение видно в нескольких кругах.</p></div><div class="insight-card"><div class="signal">Локальное отклонение</div><h3>Product: развитие</h3><p>Ниже медианы компании, но не во всех кругах.</p></div><div class="insight-card"><div class="signal">Сначала проверить данные</div><h3>Низкая выборка</h3><p>Части подгрупп не хватает ответов.</p></div></div></div><div class="section"><div class="section-head"><div><h2>Среднее по кругам и темам</h2></div></div><div class="table-wrap"><table><thead><tr><th>Круг</th><th>Фидбэк</th><th>Вовлеченность</th><th>Команда</th><th>Change</th><th>Развитие</th><th>W&L</th></tr></thead><tbody><tr><td>Product</td><td>6.7</td><td>7.4</td><td>7.8</td><td>6.5</td><td>6.2</td><td class="down">5.8</td></tr><tr><td>Sales</td><td>7.5</td><td>7.8</td><td>7.2</td><td>7.1</td><td>6.9</td><td>6.8</td></tr><tr><td>R&D</td><td>7.0</td><td>6.8</td><td>7.1</td><td>6.2</td><td>6.4</td><td>6.0</td></tr></tbody></table></div></div>`}function quality(){return`<div class="section-head"><div><h2>Качество данных</h2><p>AI-проверки до интерпретации</p></div></div><div class="grid grid-3"><div class="card pad"><strong>Полнота</strong><p style="font-size:12px;color:var(--muted)">94% ожидаемых ответов валидны.</p><div class="quality-bar"><span style="width:94%"></span></div></div><div class="card pad"><strong>Дубли</strong><p style="font-size:12px;color:var(--muted)">2 потенциальных дубля исключены.</p><div class="quality-bar"><span style="width:98%"></span></div></div><div class="card pad"><strong>Структура</strong><p style="font-size:12px;color:var(--muted)">1 круг менял состав внутри периода.</p><div class="quality-bar"><span style="width:88%"></span></div></div></div><div class="ai-hero section"><div class="ai-head"><span class="ai-badge">AI-контроль качества</span></div><p class="ai-summary"><strong>Вывод:</strong> Product можно интерпретировать. По R&D не стоит сравнивать август напрямую с июлем без поправки на изменение состава круга. Для двух малых подгрупп недостаточно ответов.</p></div><div class="table-wrap section"><table><thead><tr><th>Проверка</th><th>Объект</th><th>Сигнал</th><th>Действие системы</th></tr></thead><tbody><tr><td>Минимальный размер выборки</td><td>R&D / подгруппа</td><td><span class="status yellow">6 ответов</span></td><td>Скрыть отдельный срез</td></tr><tr><td>Изменение структуры</td><td>R&D</td><td><span class="status yellow">+18% состава</span></td><td>Предупредить при сравнении</td></tr><tr><td>Дубли</td><td>Все круги</td><td><span class="status green">2 исключены</span></td><td>Не включать в расчёт</td></tr></tbody></table></div>`}function campaigns(){return`<div class="note blue">Перед запуском проверяем версии вопросов, аудиторию, оцениваемого лидера, несколько кругов и расписание.</div><div class="section-head section"><div><h2>Кампании</h2></div><button class="btn primary">Создать кампанию</button></div><div class="table-wrap"><table><thead><tr><th>Кампания</th><th>Период</th><th>Аудитория</th><th>Статус</th></tr></thead><tbody><tr><td>Сентябрьский опрос</td><td>02.09–09.09</td><td>Основные круги</td><td><span class="status gray">Черновик</span></td></tr><tr><td>Августовский опрос</td><td>05.08–12.08</td><td>Основные круги</td><td><span class="status green">Завершён</span></td></tr></tbody></table></div><div class="grid grid-2 section"><div class="card pad"><div class="section-head"><div><h2>Проверка перед запуском</h2></div></div><div class="checklist"><div class="check-item"><span class="check-icon">✓</span><div><strong>Версии вопросов</strong><small>Актуальный набор зафиксирован.</small></div><span class="status green">OK</span></div><div class="check-item"><span class="check-icon warn">!</span><div><strong>Несколько кругов</strong><small>7 сотрудников попадают в несколько выборок.</small></div><span class="status yellow">7</span></div></div></div><div class="card pad"><div class="section-head"><div><h2>Preview выборки</h2></div></div><div class="mini-table"><div class="mini-row head"><span>Сотрудник</span><span>Круг</span><span>Лидер</span><span>Дата</span></div><div class="mini-row"><span>Анна К.</span><span>Product</span><span>Иван И.</span><span>02.09</span></div><div class="mini-row"><span>Михаил С.</span><span>Platform</span><span>Елена С.</span><span>02.09</span></div></div></div></div>`}function schedules(){return`<div class="section-head"><div><h2>Расписания и напоминания</h2></div></div><div class="grid grid-3">${metric('Старт','Пн, 10:00','MChat')}${metric('Напоминание','17:00','если нет ответа')}${metric('Закрытие','18:00','следующий день')}</div><div class="ai-hero section"><div class="ai-head"><span class="ai-badge">AI-проверка расписания</span></div><p class="ai-summary">Найдено 7 сотрудников в нескольких кругах. Для 4 приглашения назначены на один день. AI предлагает развести отправки, чтобы снизить риск перегрузки и путаницы.</p><div class="ai-grid section"><div class="ai-card"><div class="eyebrow">Конфликт</div><h3>4 пересечения</h3><p>Два разных опроса в один день.</p></div><div class="ai-card"><div class="eyebrow">Рекомендация</div><h3>Разнести на 24 часа</h3><p>Основной круг — понедельник, дополнительный — вторник.</p></div><div class="ai-card"><div class="eyebrow">Проверка</div><h3>Preview перед запуском</h3><p>Подтвердить сотрудника, круг, лидера и дату.</p></div></div></div><div class="note yellow section">AI не выбирает неоднозначное бизнес-правило выборки сам. Он проверяет конфликты после того, как правило задано администратором.</div>`}function questions(){return`<div class="section-head"><div><h2>Вопросы, темы и версии</h2></div></div><div class="table-wrap"><table><thead><tr><th>Вопрос</th><th>Тема</th><th>Версия</th><th>Factor Team</th></tr></thead><tbody><tr><td>Мой лидер прозрачно и четко формулирует цели и задачи</td><td>Отношение с лидером</td><td>v4</td><td>Да</td></tr><tr><td>Лидер создаёт пространство для качественной обратной связи</td><td>Фидбэк</td><td>v3</td><td>Да</td></tr></tbody></table></div><div class="note section">Изменение формулировки создаёт новую версию, а не перезаписывает прошлую.</div>`}function structure(){return`<div class="section-head"><div><h2>История кругов и структуры</h2><p>Срез на дату ответа</p></div></div><div class="structure"><div class="card tree"><button class="active">Product</button><button class="indent">Product Core</button><button class="indent">Product Platform</button><button>Sales</button><button>R&D</button></div><div class="card pad"><div class="grid grid-3">${metric('Круг','Product Core','выбранный срез')}${metric('Лидер','Иван Иванов','с 01.06.2026')}${metric('Участники','24','на дату')}</div><div class="timeline section"><div class="time-item"><strong>01.06.2026 — сейчас</strong><p>Иван Иванов · 24 участника</p></div><div class="time-item"><strong>01.01.2026 — 31.05.2026</strong><p>Анна Петрова · 21 участник</p></div></div></div></div>`}function employee(){return`<div class="note blue">Сотрудник отвечает в MChat. Здесь замыкается цикл обратной связи: что происходит с моим кругом, что изменилось и как меняется мой опыт.</div><div class="grid grid-4 section">${metric('Результат круга','7.1','август')}${metric('Изменение','+0.1','к июлю','up')}${metric('Участие','74%','31 из 42')}${metric('Тем с изменением','3','за период')}</div><div class="section"><div class="section-head"><div><h2>Что изменилось</h2></div></div><div class="change-grid"><div class="change-card"><div class="kicker">Стало лучше</div><strong>Работа в команде</strong><div class="change-value up">+0.5</div></div><div class="change-card"><div class="kicker">Требует внимания</div><strong>Work&life balance</strong><div class="change-value down">−0.7</div></div><div class="change-card"><div class="kicker">Стабильно</div><strong>Фидбэк</strong><div class="change-value">6.7</div></div></div></div><div class="grid grid-2 section"><div class="card pad"><h2 style="font-size:16px">Последние результаты круга</h2><div class="zone-list"><div class="zone"><strong>Август</strong><span>7.1</span></div><div class="zone"><strong>Июль</strong><span>7.0</span></div><div class="zone"><strong>Июнь</strong><span>6.9</span></div></div><button class="btn section" data-go="history">Ретроспектива</button></div><div class="card pad"><h2 style="font-size:16px">Моя динамика в контексте круга</h2><div class="zone-list"><div class="zone"><div><strong>Фидбэк</strong><small>Я: 8 → 9 · круг: 6.8 → 6.7</small></div><span class="up">Я ↑</span></div><div class="zone"><div><strong>W&L balance</strong><small>Я: 7 → 5 · круг: 6.5 → 5.8</small></div><span class="down">Оба ↓</span></div></div><button class="btn section" data-go="mine">Моя динамика</button></div></div><div class="section"><div class="section-head"><div><h2>Что произошло после прошлого опроса</h2></div></div><div class="flow"><div class="flow-step"><span class="num">1</span><strong>Увидели сигнал</strong><p>Снизилась прозрачность распределения задач.</p></div><div class="flow-step"><span class="num">2</span><strong>Обсудили</strong><p>Тему вынесли на командный синк.</p></div><div class="flow-step"><span class="num">3</span><strong>Проверяем</strong><p>В следующей волне смотрим эффект.</p></div></div></div>`}function history(){return`<div class="note blue">Исторический результат связан с кругом и лидером, актуальными на момент ответа.</div><div class="table-wrap section"><table><thead><tr><th>Период</th><th>Лидер</th><th>Результат</th><th>Участие</th><th>Зона внимания</th></tr></thead><tbody><tr><td>Август</td><td>Иван Иванов</td><td>7.1</td><td>74%</td><td>W&L balance</td></tr><tr><td>Июль</td><td>Иван Иванов</td><td>7.0</td><td>68%</td><td>Развитие</td></tr><tr><td>Июнь</td><td>Иван Иванов</td><td>6.9</td><td>72%</td><td>Развитие</td></tr><tr><td>Май</td><td>Анна Петрова</td><td>6.8</td><td>70%</td><td>Фидбэк</td></tr></tbody></table></div>`}function mine(){return`<div class="note yellow">Личная динамика требует отдельного приватного контура, потому что текущая архитектура обезличивает ответы после приёма.</div><div class="table-wrap section"><table><thead><tr><th>Тема</th><th>Март</th><th>Апрель</th><th>Май</th><th>Июнь</th><th>Июль</th><th>Август</th><th>Мой тренд</th><th>Круг</th></tr></thead><tbody><tr><td>Фидбэк</td><td>7</td><td>8</td><td>8</td><td>8</td><td>8</td><td>9</td><td class="up">↑</td><td>→</td></tr><tr><td>Развитие</td><td>7</td><td>7</td><td>7</td><td>6</td><td>6</td><td>6</td><td class="down">↓</td><td class="down">↓</td></tr><tr><td>W&L balance</td><td>7</td><td>7</td><td>6</td><td>6</td><td>7</td><td>5</td><td class="down">↓</td><td class="down">↓</td></tr></tbody></table></div>`}function system(){return`<div class="section-head"><div><h2>Связанные системы</h2></div></div><div class="grid grid-2"><div class="ext-card"><div><strong>MChat</strong><p>Опрос и напоминания.</p></div><span class="status blue">Внешняя система</span></div><div class="ext-card"><div><strong>HR-система</strong><p>Источник сотрудников, кругов и лидеров.</p></div><span class="status blue">Источник данных</span></div><div class="ext-card"><div><strong>Кабинет лидера</strong><p>Получает краткий срез.</p></div><span class="status gray">Отдельный продукт</span></div><div class="ext-card"><div><strong>Superset</strong><p>Переходный интерфейс.</p></div><span class="status yellow">Переходный слой</span></div></div>`}const screens={leader:{overview:leaderOverview,analytics:leaderAnalytics,dynamics,attention,recommendations,system},hr:{overview:hr,analytics:hr,quality,structure,system},admin:{campaigns,questions,schedules,structure,system},employee:{overview:employee,history,mine,system}};const titles={leader:{overview:'Обзор своего круга',analytics:'Полная аналитика',dynamics:'Динамика',attention:'Зоны внимания',recommendations:'Рекомендации',system:'Связанные интерфейсы'},hr:{overview:'Обзор всех кругов',analytics:'Сравнение кругов',quality:'Качество данных',structure:'История структуры',system:'Связанные интерфейсы'},admin:{campaigns:'Кампании',questions:'Вопросы, темы и версии',schedules:'Расписания и напоминания',structure:'Структура кругов',system:'Связанные системы'},employee:{overview:'Мой круг',history:'Ретроспектива круга',mine:'Моя динамика',system:'Как проходит опрос'}};function renderNav(){el('nav').innerHTML=navs[state.role].map(x=>`<button class="${state.route===x[0]?'active':''}" data-route="${x[0]}"><span class="dot"></span>${x[1]}</button>`).join('');el('nav').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;render()})}function render(){renderNav();el('title').textContent=titles[state.role][state.route];el('eyebrow').textContent=state.role==='leader'?'Платформа аналитики · лидер · Product':state.role==='hr'?'Платформа аналитики · HR':state.role==='admin'?'HR / администратор опроса':'Платформа аналитики · сотрудник';el('toolbar').style.display=state.role==='admin'||state.route==='system'?'none':'flex';el('screen').innerHTML=screens[state.role][state.route]();el('screen').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.route=b.dataset.go;render()})}el('role').onchange=e=>{state.role=e.target.value;state.route=navs[state.role][0][0];render()};render()})();</script></body></html>
