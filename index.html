<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поделись мнением</title><style>:root{--bg:#f6f7f8;--card:#fff;--text:#17191c;--muted:#6f747c;--line:#e4e7eb;--green:#2f7a4c;--red:#a23b3b;--yellow:#966200;--blue:#46669b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{background:#111317;color:white;padding:20px 15px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font-size:16px;font-weight:800;padding:8px 10px 18px}.brand small{display:block;font-size:11px;color:#8f96a0;font-weight:400;margin-top:4px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#c5c9cf;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#252930;color:white}.role{margin-top:auto;border-top:1px solid #2d3138;padding:14px 10px 0}.role label{font-size:11px;color:#8f96a0;display:block;margin-bottom:6px}.role select{width:100%;background:#1b1f24;color:white;border:1px solid #343941;border-radius:9px;padding:9px}.main{min-width:0}.top{padding:15px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;background:rgba(246,247,248,.95);backdrop-filter:blur(10px);z-index:5}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:4px}.title{font-size:21px;font-weight:800}.tools{display:flex;gap:8px}.tools select{border:1px solid var(--line);border-radius:9px;padding:8px;background:white}.content{padding:26px;max-width:1450px;margin:auto}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.metric .label{font-size:11px;color:var(--muted)}.metric .value{font-size:28px;font-weight:800;margin-top:9px}.metric .meta{font-size:11px;color:var(--muted);margin-top:7px}.up{color:var(--green)!important}.down{color:var(--red)!important}.section{margin-top:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:10px}.head h2{font-size:16px;margin:0}.head p{font-size:11px;color:var(--muted);margin:4px 0 0}.note{padding:12px;border:1px solid #d2ddec;background:#eef3fb;color:#3f577d;border-radius:10px;font-size:11px;line-height:1.5}.note.warn{background:#fff5d9;border-color:#ead8a2;color:#6d5315}.change{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.change>div,.flow>div,.insight,.action{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.change strong,.flow strong,.insight strong,.action strong{display:block;font-size:13px;margin-top:6px}.big{font-size:21px;font-weight:800;margin-top:10px}.change p,.flow p,.insight p,.action p{font-size:11px;color:var(--muted);line-height:1.45;margin:5px 0 0}.zones{display:flex;flex-direction:column;gap:8px}.zone{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.zone strong{font-size:12px}.zone small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.score{font-size:12px;font-weight:800}.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#17191c;color:white;font-size:10px;font-weight:800}.table{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}th{background:#fafbfb;color:var(--muted)}.status{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}.ok{background:#eaf4ee;color:var(--green)}.warn{background:#fff4d6;color:var(--yellow)}.muted{background:#eef0f2;color:#555b63}.check{display:flex;flex-direction:column;gap:8px}.check>div{display:grid;grid-template-columns:22px 1fr auto;gap:9px;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}.ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eaf4ee;color:var(--green);font-size:10px;font-weight:800}.ico.attn{background:#fff4d6;color:var(--yellow)}.check strong{font-size:12px}.check small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.btn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.dark{background:#17191c;color:white;border-color:#17191c}.tree{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}.treebox{background:white;border:1px solid var(--line);border-radius:13px;padding:10px}.treebox div{padding:9px;border-radius:8px;font-size:11px}.treebox div:first-child{background:#f0f1f2;font-weight:700}.ext{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ext>div{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.ext strong{font-size:12px}.ext p{font-size:11px;color:var(--muted);line-height:1.45}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.change,.flow,.ext,.tree{grid-template-columns:1fr}}@media(max-width:600px){.g4{grid-template-columns:1fr}.top{position:static;flex-direction:column;align-items:flex-start}.content{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Поделись мнением<small>визуальный прототип платформы</small></div><nav id="navEl" class="nav"></nav><div class="role"><label>Представление</label><select id="roleEl"><option value="employee">Сотрудник</option><option value="leader">Лидер</option><option value="hr">HR</option><option value="admin">HR / администратор</option></select></div></aside><main class="main"><header class="top"><div><div id="eyebrowEl" class="eyebrow"></div><div id="titleEl" class="title"></div></div><div id="toolsEl" class="tools"><select><option>Август 2026</option><option>Июль 2026</option></select><select><option>Product</option><option>Sales</option><option>R&D</option></select></div></header><div id="screenEl" class="content"></div></main></div><script>(()=>{const state={role:'employee',route:'overview'};const nav={employee:[['overview','Мой круг'],['history','Ретроспектива круга'],['mine','Моя динамика'],['system','Как проходит опрос']],leader:[['overview','Обзор'],['analytics','Полная аналитика'],['attention','Зоны внимания'],['recommendations','Рекомендации'],['system','Связанные интерфейсы']],hr:[['overview','Обзор компании'],['analytics','Сравнение кругов'],['quality','Качество данных'],['structure','История структуры'],['system','Связанные интерфейсы']],admin:[['campaigns','Кампании'],['questions','Вопросы и версии'],['schedule','Расписания'],['structure','Структура кругов'],['system','Связанные системы']]};const topics=[['Отношение с лидером',7.2,.2],['Фидбэк',6.7,-.1],['Вовлеченность',7.4,.4],['Признание',6.9,-.2],['Работа в команде',7.8,.5],['Change',6.5,-.4],['Развитие',6.2,-.3],['Work&life balance',5.8,-.7],['Мотивация',7,.1]];const $=id=>document.getElementById(id),navEl=$('navEl'),roleEl=$('roleEl'),eyebrowEl=$('eyebrowEl'),titleEl=$('titleEl'),toolsEl=$('toolsEl'),screenEl=$('screenEl');const metric=(l,v,m,c='')=>`<div class="card metric"><div class="label">${l}</div><div class="value">${v}</div><div class="meta ${c}">${m}</div></div>`;const topicTable=()=>`<div class="table"><table><thead><tr><th>Тема</th><th>Среднее</th><th>Изменение</th></tr></thead><tbody>${topics.map(t=>`<tr><td>${t[0]}</td><td>${t[1].toFixed(1)}</td><td class="${t[2]<0?'down':t[2]>0?'up':''}">${t[2]>0?'+':''}${t[2].toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`;function employee(){return`<div class="note">Сотрудник продолжает отвечать в MChat. Здесь замыкается цикл обратной связи: что происходит с моим кругом, что изменилось и как меняется мой собственный опыт. Числа — демонстрационные.</div><div class="grid g4 section">${metric('Результат круга','7.1','август 2026')}${metric('Изменение','+0.1','к июлю','up')}${metric('Участие','74%','31 ответ из 42')}${metric('Тем с изменением','3','за период')}</div><section class="section"><div class="head"><div><h2>Что изменилось с прошлого периода</h2><p>Быстрый ответ вместо чтения всей таблицы</p></div></div><div class="change"><div><div class="kicker">Стало лучше</div><strong>Работа в команде</strong><div class="big up">+0.5</div><p>Самый заметный положительный сдвиг.</p></div><div><div class="kicker">Требует внимания</div><strong>Work&life balance</strong><div class="big down">−0.7</div><p>Снижение второй период подряд.</p></div><div><div class="kicker">Без заметного изменения</div><strong>Фидбэк</strong><div class="big">6.7</div><p>Показатель стабилен.</p></div></div></section><div class="grid g2 section"><div class="card"><div class="head"><div><h2>Последние результаты круга</h2><p>Ретроспектива</p></div></div><div class="zones"><div class="zone"><div><strong>Август 2026</strong><small>Текущий период</small></div><div class="score">7.1</div></div><div class="zone"><div><strong>Июль 2026</strong></div><div class="score">7.0</div></div><div class="zone"><div><strong>Июнь 2026</strong></div><div class="score">6.9</div></div></div><button class="btn section" data-go="history">Посмотреть ретроспективу</button></div><div class="card"><div class="head"><div><h2>Моя динамика в контексте круга</h2><p>Это мой опыт или общая тенденция?</p></div></div><div class="zones"><div class="zone"><div><strong>Фидбэк</strong><small>Я: 8 → 9 · круг: 6.8 → 6.7</small></div><div class="score up">Я ↑</div></div><div class="zone"><div><strong>Work&life balance</strong><small>Я: 7 → 5 · круг: 6.5 → 5.8</small></div><div class="score down">Оба ↓</div></div></div><button class="btn section" data-go="mine">Посмотреть мою динамику</button></div></div><section class="section"><div class="head"><div><h2>Что произошло после прошлого опроса</h2><p>Демо-сценарий замыкания обратной связи</p></div></div><div class="flow"><div><span class="num">1</span><strong>Увидели сигнал</strong><p>Снизилась прозрачность распределения задач.</p></div><div><span class="num">2</span><strong>Обсудили</strong><p>Тему вынесли на командный синк.</p></div><div><span class="num">3</span><strong>Проверяем изменение</strong><p>В следующей волне смотрим эффект.</p></div></div></section><section class="section"><div class="head"><div><h2>Темы моего круга</h2><p>Только агрегированные значения</p></div></div>${topicTable()}</section>`}function employeeHistory(){return`<div class="note">Исторический результат остаётся связан с кругом и лидером, которые были актуальны на момент ответа.</div><section class="section"><div class="head"><div><h2>Ретроспектива круга Product</h2><p>Последние периоды</p></div></div><div class="table"><table><thead><tr><th>Период</th><th>Лидер на период</th><th>Результат</th><th>Участие</th><th>Сильная тема</th><th>Зона внимания</th></tr></thead><tbody><tr><td>Август</td><td>Иван Иванов</td><td>7.1</td><td>74%</td><td>Работа в команде</td><td>W&L balance</td></tr><tr><td>Июль</td><td>Иван Иванов</td><td>7.0</td><td>68%</td><td>Работа в команде</td><td>Развитие</td></tr><tr><td>Июнь</td><td>Иван Иванов</td><td>6.9</td><td>72%</td><td>Вовлеченность</td><td>Развитие</td></tr><tr><td>Май</td><td>Анна Петрова</td><td>6.8</td><td>70%</td><td>Работа в команде</td><td>Фидбэк</td></tr></tbody></table></div></section>`}function mine(){return`<div class="note warn">«Моя динамика» требует отдельного приватного контура персональной истории: текущая архитектура обезличивает ответы после приёма.</div><div class="grid g3 section">${metric('Последний опрос','Август 2026','Product')}${metric('Периодов в истории','6','демо')}${metric('Тем с трендом','2','в примере')}</div><section class="section"><div class="head"><div><h2>Моя динамика и динамика круга</h2><p>Сравнение тенденций, не оценка эффективности</p></div></div><div class="table"><table><thead><tr><th>Тема</th><th>Март</th><th>Апрель</th><th>Май</th><th>Июнь</th><th>Июль</th><th>Август</th><th>Мой тренд</th><th>Круг</th></tr></thead><tbody><tr><td>Фидбэк</td><td>7</td><td>8</td><td>8</td><td>8</td><td>8</td><td>9</td><td class="up">↑</td><td>→</td></tr><tr><td>Развитие</td><td>7</td><td>7</td><td>7</td><td>6</td><td>6</td><td>6</td><td class="down">↓</td><td class="down">↓</td></tr><tr><td>Work&life balance</td><td>7</td><td>7</td><td>6</td><td>6</td><td>7</td><td>5</td><td class="down">↓</td><td class="down">↓</td></tr></tbody></table></div></section>`}function leader(){return`<div class="note">Лидер получает полную аналитику своего круга. JTBD меняет приоритет: сначала что изменилось и где нужен фокус, затем детализация.</div><div class="grid g4 section">${metric('Factor Team','7.2','+0.3','up')}${metric('Участие','74%','31 из 42')}${metric('Тем улучшились','4','за период','up')}${metric('Тем требуют внимания','3','по сигналам','down')}</div><section class="section"><div class="head"><div><h2>Что изменилось</h2><p>Сводка перед синком</p></div></div><div class="change"><div><div class="kicker">Сильный сдвиг</div><strong>Работа в команде</strong><div class="big up">+0.5</div></div><div><div class="kicker">Устойчивый риск</div><strong>Work&life balance</strong><div class="big down">−0.7</div></div><div><div class="kicker">Локальный сигнал</div><strong>Развитие</strong><div class="big down">−0.3</div></div></div></section><div class="grid g2 section"><div class="card"><div class="head"><div><h2>Зоны внимания</h2><p>Сигнал → причина</p></div></div><div class="zones"><div class="zone"><div><strong>Work&life balance</strong><small>Снижается 2 периода · нагрузка и вмешательство работы в личное время</small></div><div class="score down">5.8</div></div><div class="zone"><div><strong>Развитие</strong><small>Ниже медианы компании</small></div><div class="score down">6.2</div></div></div></div><div class="card"><div class="head"><div><h2>Следующие действия</h2></div></div><div class="action"><div class="kicker">Сигнал</div><strong>Work&life balance снижается</strong><div class="kicker" style="margin-top:10px">Что проверить</div><p>Какие роли и типы задач создают перегрузку.</p><div class="kicker" style="margin-top:10px">Следующий шаг</div><p>Разобрать нагрузку на синке и зафиксировать одно изменение.</p></div></div></div><section class="section"><div class="head"><div><h2>Темы</h2><p>Полная аналитика своего круга</p></div></div>${topicTable()}</section>`}function hr(){return`<div class="grid g4">${metric('Участие','71%','по кругам')}${metric('Среднее','7.1','по темам')}${metric('Медиана','7.3','по темам')}${metric('Factor Team','7.0','по лидерским вопросам')}</div><section class="section"><div class="head"><div><h2>Сигналы по компании</h2><p>Системное vs локальное vs качество данных</p></div></div><div class="grid g3"><div class="insight"><div class="kicker">Системный сигнал</div><strong>Work&life balance</strong><p>Снижение видно в нескольких кругах.</p></div><div class="insight"><div class="kicker">Локальное отклонение</div><strong>Product: развитие</strong><p>Ниже медианы компании, но не во всех кругах.</p></div><div class="insight"><div class="kicker">Сначала проверить данные</div><strong>Низкая выборка</strong><p>Части подгрупп не хватает ответов.</p></div></div></section><section class="section"><div class="head"><div><h2>Среднее по кругам и темам</h2></div></div><div class="table"><table><thead><tr><th>Круг</th><th>Фидбэк</th><th>Вовлеченность</th><th>Команда</th><th>Change</th><th>Развитие</th><th>W&L balance</th></tr></thead><tbody><tr><td>Product</td><td>6.7</td><td>7.4</td><td>7.8</td><td>6.5</td><td>6.2</td><td class="down">5.8</td></tr><tr><td>Sales</td><td>7.5</td><td>7.8</td><td>7.2</td><td>7.1</td><td>6.9</td><td>6.8</td></tr><tr><td>R&D</td><td>7.0</td><td>6.8</td><td>7.1</td><td>6.2</td><td>6.4</td><td>6.0</td></tr></tbody></table></div></section><div class="grid g2 section"><div class="card"><div class="head"><div><h2>Эффект изменений</h2></div></div><p style="font-size:11px;color:var(--muted)">Каркас для сравнения состояния до и после организационных изменений.</p></div><div class="card"><div class="head"><div><h2>Перед выводом</h2><p>Качество данных — часть сценария</p></div></div><div class="check"><div><span class="ico">✓</span><div><strong>Проверить охват</strong><small>Достаточно ли ответов.</small></div><span class="status ok">OK</span></div><div><span class="ico attn">!</span><div><strong>Проверить структуру</strong><small>Не менялся ли состав круга.</small></div><span class="status warn">1 сигнал</span></div></div></div></div>`}function campaigns(){return`<div class="note">Единая точка управления остаётся прежней. Перед запуском проверяем версии вопросов, аудиторию, оцениваемого лидера, несколько кругов и расписание.</div><div class="head section"><div><h2>Кампании</h2><p>Управление опросами</p></div><button class="btn dark">Создать кампанию</button></div><div class="table"><table><thead><tr><th>Кампания</th><th>Период</th><th>Аудитория</th><th>Выборка</th><th>Статус</th></tr></thead><tbody><tr><td>Сентябрьский опрос</td><td>02.09–09.09</td><td>Основные круги</td><td>25% в неделю</td><td><span class="status muted">Черновик</span></td></tr><tr><td>Августовский опрос</td><td>05.08–12.08</td><td>Основные круги</td><td>25% в неделю</td><td><span class="status ok">Завершён</span></td></tr></tbody></table></div><div class="grid g2 section"><div class="card"><div class="head"><div><h2>Проверка перед запуском</
