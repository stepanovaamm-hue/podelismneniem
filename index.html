<script>
(function(){

    admin:[['campaigns','Кампании'],['questions','Вопросы, темы и версии'],['schedules','Расписания и напоминания'],['structure','Структура кругов'],['system','Связанные системы']],
    employee:[['overview','Мой круг'],['circleHistory','Ретроспектива круга'],['myAnswers','Моя динамика'],['system','Как проходит опрос']]
  };
  const topics=[['Отношение с лидером',5.0],['Фидбэк',5.5],['Вовлеченность',7.0],['Признание',8.0],['Работа в команде',3.0],['Доменно-ролевая модель',4.0],['Change',5.5],['Развитие',5.0],['Work & life balance',8.0],['Мотивация',7.0]];
  function metric(label,value,meta,cls=''){return `<div class="card pad metric"><div class="label">${label}</div><div class="value">${value}</div><div class="meta ${cls}">${meta}</div></div>`;}
  function leaderOverview(){return `<div class="note blue">Пример построен на реальной выгрузке <strong>HR | Поделись мнением</strong> от 18.08.2026. Выбран круг <strong>Customer Support</strong>. AI-интерпретация отделена от фактических значений: причины — гипотезы, а не выводы из данных.</div><div class="grid grid-4 section">${metric('Среднее по индексным темам','5.8','10 тем из выгрузки')}${metric('Участие','15.4%','ключевой фактор доверия','down')}${metric('Сильные темы','2','Признание и Work & life balance','up')}${metric('Темы ≤ 5.5','6','нужна проверка с командой','down')}</div><div class="section"><div class="section-head"><div><h2>Что AI замечает в текущем срезе</h2><p>Не динамика: в выгрузке нет полноценного ряда средних по периодам</p></div></div><div class="change-grid"><div class="change-card"><div class="kicker">Самый сильный сигнал</div><strong>Работа в команде</strong><div class="change-value down">3.0</div><p>Самая низкая оценка среди индексных тем. Вопрос — про участие во внутренних собраниях, обсуждениях и коллаборативных проектах.</p></div><div class="change-card"><div class="kicker">Второй сигнал</div><strong>Доменно-ролевая модель</strong><div class="change-value down">4.0</div><p>Низкая оценка утверждения «Я хочу и дальше занимать свою роль» — возможный сигнал про соответствие роли ожиданиям.</p></div><div class="change-card"><div class="kicker">Что не выглядит проблемой</div><strong>Work & life balance</strong><div class="change-value up">8.0</div><p>Баланс заметно выше большинства других тем, поэтому гипотеза «основная проблема — перегрузка» выглядит слабее.</p></div></div></div><div class="grid grid-2 section"><div class="card pad"><div class="section-head"><div><h2>Зоны внимания</h2><p>Факт → интерпретация</p></div></div><div class="zone-list"><div class="zone"><div><strong>Работа в команде</strong><small>3.0 · самый низкий показатель круга</small></div><div class="zone-score down">Высокий</div></div><div class="zone"><div><strong>Доменно-ролевая модель</strong><small>4.0 · желание продолжать текущую роль</small></div><div class="zone-score down">Высокий</div></div><div class="zone"><div><strong>Отношение с лидером / Развитие</strong><small>5.0 · обратная связь и ясность способов роста</small></div><div class="zone-score">Средний</div></div></div></div><div class="card pad"><div class="section-head"><div><h2>Что AI предложит сделать первым</h2></div></div><div class="action-card"><div class="action-label">Сначала</div><strong>Не делать широкий вывод по кругу</strong><div class="action-label">Почему</div><p>Ответили 15.4% сотрудников. При такой выборке AI должен понижать уверенность и использовать формулировку «сигнал для проверки».</p><div class="action-label">Следующий шаг</div><p>Проверить темы «командная работа» и «роль» на ближайшем командном обсуждении и параллельно повысить участие в следующей волне.</p></div></div></div><div class="section"><div class="section-head"><div><h2>Темы Customer Support</h2><p>Фактические средние из выгрузки</p></div></div><div class="table-wrap"><table><thead><tr><th>Тема</th><th>Среднее</th><th>AI-статус</th></tr></thead><tbody>${topics.map(t=>`<tr><td><strong>${t[0]}</strong></td><td>${t[1].toFixed(1)}</td><td>${t[1]<5?'<span class="status red">Сильный сигнал</span>':t[1]<=5.5?'<span class="status yellow">Проверить</span>':t[1]>=8?'<span class="status green">Сильная сторона</span>':'<span class="status gray">Нейтрально</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;}
  function leaderAnalytics(){return `<div class="section-head"><div><h2>Полная аналитика Customer Support</h2><p>Реальная выгрузка → AI-интерпретация</p></div></div><div class="filters"><select><option>Customer Support</option></select><select><option>Выгрузка 18.08.2026</option></select><select><option>Все темы</option></select></div><div class="ai-hero section"><div class="ai-head"><div><span class="ai-badge">AI-сводка</span></div><span class="ai-confidence">Уверенность низкая · участие 15.4%</span></div><p class="ai-summary"><strong>Главный сигнал:</strong> сильнее всего проседают командное взаимодействие (3.0) и желание продолжать текущую роль (4.0). При этом признание инициатив и Work & life balance оценены высоко — по 8.0. AI предлагает проверить более узкие гипотезы про формат совместной работы и соответствие роли ожиданиям.</p><div class="ai-grid section"><div class="ai-card"><div class="eyebrow">Факт</div><h3>Командная работа — 3.0</h3><p>Минимальная оценка в круге и крупнейшее отклонение от общего уровня этой темы — около 8.0.</p><div class="ai-evidence">Вопрос: участие во внутренних собраниях, обсуждениях и коллаборативных проектах.</div></div><div class="ai-card"><div class="eyebrow">Факт</div><h3>Роль — 4.0</h3><p>Ответ на утверждение «Я хочу и дальше занимать свою роль» заметно ниже общего уровня.</p><div class="ai-evidence">Это не доказывает намерение уйти: вопрос отражает отношение к текущей роли.</div></div><div class="ai-card"><div class="eyebrow">Гипотеза</div><h3>Проблема локальнее, чем «плохие условия»</h3><p>Work & life balance = 8.0 и признание = 8.0. Поэтому AI предлагает сначала проверить устройство роли и совместной работы.</p><div class="ai-evidence">Гипотеза требует подтверждения разговором с командой.</div></div></div></div><div class="table-wrap section"><table><thead><tr><th>Тема</th><th>Вопрос из выгрузки</th><th>Customer Support</th><th>Общий уровень</th><th>AI-сигнал</th></tr></thead><tbody><tr><td>Отношение с лидером</td><td>Обратная связь лидера помогает увидеть сильные стороны и зоны развития</td><td>5.0</td><td>8.20</td><td><span class="status yellow">Ниже общего уровня</span></td></tr><tr><td>Работа в команде</td><td>Я активно участвую во внутренних собраниях, обсуждениях и коллаборативных проектах</td><td>3.0</td><td>8.03</td><td><span class="status red">Главный сигнал</span></td></tr><tr><td>Доменно-ролевая модель</td><td>Я хочу и дальше занимать свою роль</td><td>4.0</td><td>8.40</td><td><span class="status red">Главный сигнал</span></td></tr><tr><td>Развитие</td><td>Лидер понятно доносит и разъясняет способы роста и развития</td><td>5.0</td><td>7.82</td><td><span class="status yellow">Проверить</span></td></tr><tr><td>Work & life balance</td><td>Лидер помогает минимизировать вмешательство рабочих задач в личное время</td><td>8.0</td><td>8.79</td><td><span class="status green">Не главный риск</span></td></tr></tbody></table></div><div class="note section">Общий уровень — итоговое значение по доступным кругам из листа «Детализация вопросов» этой же выгрузки. Это ориентир, а не официальный benchmark.</div>`;}
  function leaderQuestions(){const q=[['Отношение с лидером','Обратная связь, которую дает лидер, помогает мне увидеть свои сильные стороны и зоны развития',5.0,8.20,-3.20,'Проверить качество и конкретность обратной связи'],['Фидбэк','По шкале от 1 до 10, как ты оцениваешь эффективность текущих процессов обратной связи в твоём круге?',5.5,8.61,-3.11,'Процессы фидбэка заметно ниже общего уровня'],['Вовлеченность','Мне нравится участвовать в командных брейнштормах, поиске и выработке решений',7.0,8.52,-1.52,'Сигнал умеренный, не основной приоритет'],['Признание','Инициативы, которые я предлагаю, не остаются без внимания',8.0,8.82,-0.82,'Относительно сильная сторона круга'],['Работа в команде','Я активно участвую во внутренних собраниях, обсуждениях и коллаборативных проектах',3.0,8.03,-5.03,'Самое сильное отрицательное отклонение'],['Доменно-ролевая модель','Я хочу и дальше занимать свою роль',4.0,8.40,-4.40,'Сильный сигнал про отношение к текущей роли'],['Change','По шкале от 1 до 10, насколько изменения в команде происходят комфортно для тебя?',5.5,8.08,-2.58,'Изменения воспринимаются сложнее общего уровня'],['Развитие','Лидер понятно доносит и разъясняет, какие способы роста и развития у меня есть',5.0,7.82,-2.82,'Проверить ясность траекторий роста'],['Work & life balance','Лидер помогает минимизировать случаи, когда рабочие задачи вмешиваются в моё личное время',8.0,8.79,-0.79,'Не выглядит главным источником проблемы'],['Мотивация','Лидер направляет меня, если я не понимаю, где искать информацию о бонусах, бенефитах и других возможностях',7.0,8.86,-1.86,'Ниже общего уровня, но не главный сигнал']];return `<div class="note blue">Все значения взяты из листа <strong>«Детализация вопросов»</strong> выгрузки от 18.08.2026. Для Customer Support участие — <strong>15.4%</strong>, поэтому AI трактует результаты как сигналы для проверки.</div><div class="grid grid-4 section">${metric('Вопросов в блоке','10','индексные темы')}${metric('Вопросов ≤ 5.5','6','требуют проверки', wn">Приоритет 2</div></div><div class="zone"><div><strong>Сохраняемые сильные стороны</strong><small>Признание 8.0 · Work & life balance 8.0</small></div><div class="zone-score up">Сохранить</div></div></div></div><div class="card pad"><div class="section-head"><div><h2>Вопросы лидеру для проверки гипотез</h2><p>Не повтор опроса, а сценарий разговора с командой</p></div></div><div class="recommendation"><strong>1. Про совместную работу</strong><p>Какие командные встречи и обсуждения реально помогают вам влиять на решения, а какие воспринимаются как формальность?</p></div><div class="recommendation"><strong>2. Про роль</strong><p>Какие части вашей текущей роли хочется сохранить, а какие изменить или пересобрать?</p></div><div class="recommendation"><strong>3. Про обратную связь и развитие</strong><p>После обратной связи вам понятно, что именно делать дальше и какие возможности роста у вас есть?</p></div><div class="recommendation"><strong>4. Про изменения</strong><p>Что в последних изменениях было наиболее непонятным или создавало лишнее напряжение?</p></div></div></div><div class="note yellow section"><strong>AI-ограничение:</strong> при 15.4% участия система не должна говорить «команда считает». Корректная формулировка — «в текущих ответах есть сигнал».</div>`;}
  function leaderDynamics(){return `<div class="section-head"><div><h2>Динамика</h2><p>Что можно и нельзя построить по этой выгрузке</p></div></div><div class="note yellow">В выгрузке есть текущие средние по темам и отдельная таблица медиан за апрель и июль на уровне L3, но нет полноценного сопоставимого ряда средних Customer Support по периодам. Поэтому прототип <strong>не придумывает</strong> изменение +/− и не строит тренд.</div><div class="grid grid-3 section">${metric('Текущий срез','5.8','среднее по 10 индексным темам')}${metric('Участие','15.4%','Customer Support','down')}${metric('Дата выгрузки','18.08.2026','HR | Поделись мнением')}</div><div class="ai-hero section"><div class="ai-head"><span class="ai-badge">AI-правило</span><span class="ai-confidence">Защита от ложной динамики</span></div><p class="ai-summary">Если у системы нет сопоставимых данных за два периода, AI должен говорить «недостаточно данных для тренда», а не интерполировать изменение.</p></div>`;}
  function leaderAttention(){return `<div class="section-head"><div><h2>Зоны внимания</h2><p>Ранжирование по силе отклонения, но с поправкой на участие 15.4%</p></div></div><div class="rec-list"><div class="rec"><span class="rec-num">1</span><div><h3>Работа в команде · 3.0</h3><p>AI предлагает проверить, что мешает участию в совместных обсуждениях: формат встреч, ощущение влияния, распределение ролей или релевантность обсуждений.</p></div><div class="rec-meta">Приоритет<br><strong>Высокий</strong></div></div><div class="rec"><span class="rec-num">2</span><div><h3>Доменно-ролевая модель · 4.0</h3><p>Проверить содержание роли, ожидания, автономию и совпадение реальных задач с ожидаемыми.</p></div><div class="rec-meta">Приоритет<br><strong>Высокий</strong></div></div><div class="rec"><span class="rec-num">3</span><div><h3>Отношение с лидером и развитие · 5.0</h3><p>Обе темы связаны с обратной связью и пониманием развития. Их имеет смысл проверять вместе.</p></div><div class="rec-meta">Приоритет<br><strong>Средний</strong></div></div></div><div class="note yellow section">Ограничение: 15.4% участия. AI показывает приоритеты как «сигналы для проверки», а не как репрезентативный диагноз круга.</div>`;}
  function leaderRecommendations(){return `<div class="section-head"><div><h2>AI-рекомендации</h2><p>На основе фактического среза Customer Support</p></div></div><div class="ai-hero"><div class="ai-head"><span class="ai-badge">AI-рекомендации</span><span class="ai-confidence">Низкая уверенность из-за выборки</span></div><p class="ai-summary">AI не предлагает «лечить мотивацию» или нагрузку в целом. По текущим ответам логичнее сначала проверить две конкретные зоны — совместную работу и содержание роли — и одновременно повысить долю ответивших.</p></div><div class="rec-list section"><div class="rec"><span class="rec-num">1</span><div><h3>Провести 20-минутную диагностику командной работы</h3><p><strong>Основание:</strong> тема 3.0. Выбрать одно изменение в формате взаимодействия.</p></div><div class="rec-meta">Тип<br><strong>Диагностика</strong></div></div><div class="rec"><span class="rec-num">2</span><div><h3>Проверить соответствие роли ожиданиям</h3><p><strong>Основание:</strong> «Я хочу и дальше занимать свою роль» = 4.0. На one-to-one спросить, какие части роли дают энергию, какие хочется изменить и чего не хватает.</p></div><div class="rec-meta">Тип<br><strong>One-to-one</strong></div></div><div class="rec"><span class="rec-num">3</span><div><h3>Повысить участие в следующей волне</h3><p><strong>Основание:</strong> прошли опрос 15.4%. Объяснить, какие действия были сделаны по предыдущему фидбэку.</p></div><div class="rec-meta">Тип<br><strong>Качество данных</strong></div></div></div>`;}
  function hrOverview(){return `<div class="note blue">Данные взяты из выгрузки <strong>HR | Поделись мнением</strong> от 18.08.2026.</div><div class="grid grid-4 section">${metric('Среднее участие','39.6%','простое среднее по L1-кругам')}${metric('Макс. участие','63.6%','Marketing','up')}${metric('Мин. участие','9.1%','COGS','down')}${metric('Кругов','11','L1')}</div><div class="section"><div class="section-head"><div><h2>AI-сигналы по компании</h2></div></div><div class="grid grid-3"><div class="insight-card"><div class="signal">Сильное отклонение</div><h3>Customer Support</h3><p>Низкие значения по ряду тем, но участие 15.4% — вывод требует подтверждения.</p></div><div class="insight-card"><div class="signal">Риск качества</div><h3>COGS · 9.1%</h3><p>AI должен понижать доверие к сравнению.</p></div><div class="insight-card"><div class="signal">Высокий охват</div><h3>Marketing · 63.6%</h3><p>Более устойчивый текущий срез.</p></div></div></div>`;}
  function hrQuality(){return `<div class="section-head"><div><h2>Качество данных</h2></div></div><div class="ai-hero"><div class="ai-head"><span class="ai-badge">AI-контроль качества</span></div><p class="ai-summary">Перед интерпретацией система проверяет охват. Customer Support 15.4%, COGS 9.1%, Sales 25% — эти результаты нельзя сравнивать с кругами с высоким участием без предупреждения.</p></div>`;}
  function campaigns(){return `<div class="section-head"><div><h2>Кампании</h2></div></div><div class="note">Управление периодом, аудиторией, выборкой и напоминаниями.</div>`;}
  function questions(){return `<div class="section-head"><div><h2>Вопросы, темы и версии</h2></div></div><div class="table-wrap"><table><thead><tr><th>Тема</th><th>Вопрос</th><th>Статус</th></tr></thead><tbody>${topics.map(t=>`<tr><td>${t[0]}</td><td>Вопрос из актуальной версии опроса</td><td><span class="status green">Активен</span></td></tr>`).join('')}</tbody></table></div>`;}
  function schedules(){return `<div class="section-head"><div><h2>Расписания и напоминания</h2></div></div><div class="note">Каркас управления отправками в MChat и повторными напоминаниями.</div>`;}
  function structure(){return `<div class="section-head"><div><h2>История структуры</h2></div></div><div class="note">Платформа хранит привязку круга и лидера на дату ответа.</div>`;}
  function employeeOverview(){return `<div class="section-head"><div><h2>Мой круг</h2></div></div><div class="note">Для сотрудника показываются только агрегированные результаты своего круга. Опрос проходит в MChat.</div>`;}
  function employeeHistory(){return `<div class="section-head"><div><h2>Ретроспектива круга</h2></div></div><div class="note">История агрегированных результатов по доступным периодам.</div>`;}
  function employeeMy(){return `<div class="section-head"><div><h2>Моя динамика</h2></div></div><div class="note yellow">Для персональной истории нужен отдельный приватный контур, поскольку аналитическое хранилище обезличивает ответы.</div>`;}
  function system(){return `<div class="section-head"><div><h2>Связанные интерфейсы и системы</h2></div></div><div class="grid grid-2"><div class="ext-card"><div><strong>MChat</strong><p>Опрос и напоминания.</p></div><span class="status blue">Внешняя система</span></div><div class="ext-card"><div><strong>HR-система</strong><p>Источник сотрудников, кругов и лидеров.</p></div><span class="status blue">Источник данных</span></div><div class="ext-card"><div><strong>Кабинет лидера</strong><p>Получает сокращённый срез.</p></div><span class="status gray">Отдельный продукт</span></div><div class="ext-card"><div><strong>Superset</strong><p>Переходный интерфейс.</p></div><span class="status yellow">Переходный слой</span></div></div>`;}
  function renderNav(){const nav=document.getElementById('nav');nav.innerHTML=navByRole[state.role].map(i=>`<button class="${state.route===i[0]?'active':''}" data-route="${i[0]}"><span class="dot"></span>${i[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.route=b.dataset.route;render();}));}
  function render(){renderNav();const screen=document.getElementById('screen'),title=document.getElementById('pageTitle'),eyebrow=document.getElementById('eyebrow'),toolbar=document.getElementById('toolbar');if(state.role==='leader'){eyebrow.textContent='Платформа аналитики · лидер · Customer Support';title.textContent={overview:'Обзор своего круга',analytics:'Полная аналитика',leaderQuestions:'Вопросы и ответы',dynamics:'Динамика',attention:'Зоны внимания',recommendations:'Рекомендации',system:'Связанные интерфейсы'}[state.route];toolbar.style.display='flex';screen.innerHTML={overview:leaderOverview(),analytics:leaderAnalytics(),leaderQuestions:leaderQuestions(),dynamics:leaderDynamics(),attention:leaderAttention(),recommendations:leaderRecommendations(),system:system()}[state.route];}if(state.role==='hr'){eyebrow.textContent='Платформа аналитики · HR';title.textContent={overview:'Обзор всех кругов',analytics:'Сравнение кругов',quality:'Качество данных',structure:'История структуры',system:'Связанные интерфейсы'}[state.route];toolbar.style.display='flex';screen.innerHTML={overview:hrOverview(),analytics:hrOverview(),quality:hrQuality(),structure:structure(),system:system()}[state.route];}if(state.role==='admin'){eyebrow.textContent='HR / администратор';title.textContent={campaigns:'Кампании',questions:'Вопросы, темы и версии',schedules:'Расписания и напоминания',structure:'Структура кругов',system:'Связанные системы'}[state.route];toolbar.style.display='none';screen.innerHTML={campaigns:campaigns(),questions:questions(),schedules:schedules(),structure:structure(),system:system()}[state.route];}if(state.role==='employee'){eyebrow.textContent='Платформа аналитики · сотрудник';title.textContent={overview:'Мой круг',circleHistory:'Ретроспектива круга',myAnswers:'Моя динамика',system:'Как проходит опрос'}[state.route];toolbar.style.display='flex';screen.innerHTML={overview:employeeOverview(),circleHistory:employeeHistory(),myAnswers:employeeMy(),system:system()}[state.route];}}
  document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;state.route=navByRole[state.role][0][0];render();});render();
})();
</script>
