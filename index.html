<!doctype html>
<html lang="ru">
<head>

  <title>Поделись мнением — прототип</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

      <div class="role-box">

        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <div class="page-title" id="pageTitle"></div>
        </div>
        <div class="toolbar" id="toolbar">
          <select><option>Выгрузка 18.08.2026</option></select>
          <select><option>Customer Support</option><option>R&D</option><option>Sales</option></select>
